# 匿名使用統計的端點（stats/）。每次推送跑測試；合併到 main 之後，如果設定了 Cloudflare 的金鑰，就部署到 Cloudflare Workers。
# 沒有設定金鑰的時候只跑測試、不部署，不會失敗。要設定哪三個、怎麼拿，看 stats/README.md。
name: 統計端點

on:
  pull_request:
    paths: ['stats/**', '.github/workflows/stats.yml']
  push:
    branches: [main]
    paths: ['stats/**', '.github/workflows/stats.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 統計端點的測試
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stats/package-lock.json
      - run: npm ci
      - name: 檢查、存、算總表的測試
        run: npm test
      - name: 型別檢查
        run: npm run check

  deploy:
    name: 部署到 Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS_ADMIN_KEY: ${{ secrets.STATS_ADMIN_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: 金鑰設定了沒
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$STATS_ADMIN_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::還沒有設定 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、STATS_ADMIN_KEY 這三個 secret，這一次不部署。說明在 stats/README.md。"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stats/package-lock.json
      - name: 部署
        if: steps.ready.outputs.ok == 'true'
        working-directory: stats
        run: |
          npm ci
          npx wrangler deploy | tee deploy.log
          printf '%s' "$STATS_ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
          url=$(grep -o 'https://[A-Za-z0-9.-]*workers\.dev' deploy.log | head -n 1)
          {
            echo "### 統計端點部署好了"
            echo
            echo "網址：\`${url:-（在上面的紀錄裡找 workers.dev）}\`"
            echo
            echo "還沒設定的話：到 Settings → Secrets and variables → Actions → Variables，加一個 \`STATS_URL\`，值填這個網址，再重跑一次「霧脈公會」這個流程。遊戲之後才會詢問、回傳。"
          } >> "$GITHUB_STEP_SUMMARY"
