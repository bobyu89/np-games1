# 每次推送都檢查一遍；合併到 main 之後，把建好的靜態檔放到 GitHub Pages。
# 第一次要先到 Settings → Pages，把 Source 選成「GitHub Actions」。說明在 app/README.md。
name: 霧脈公會

on:
  pull_request:
    paths: ['app/**', 'docs/review/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', 'docs/review/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 檢查和建置
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 規則、評分和存檔的測試
        run: npm test
      - name: 每一個病例都走得到滿分
        run: npm run cases
      - name: 審查清單和病例檔對得上
        run: |
          npm run review
          git diff --exit-code -- ../docs/review || { echo "::error::病例改過了，docs/review 沒有跟著重新產生。請跑 npm run review 再提交。"; exit 1; }
      - name: 型別檢查和建置
        run: npm run build
        env:
          # 匿名使用統計的端點。沒有設定這個變數，遊戲就不會詢問、也不會回傳任何東西（見 stats/README.md）
          VITE_STATS_URL: ${{ vars.STATS_URL }}
      - name: 交給 Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: 放到 GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
