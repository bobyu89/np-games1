<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>前導片的靜態圖</title>
<style>html,body{margin:0;background:#1d2a25;overflow:hidden}html.clear,html.clear body{background:transparent}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<!-- 前導片用的畫面：一個網址畫一個鏡頭（?shot=名字）。trailer/make.mjs 截靜態圖，或用 window.adv(秒) 一格一格往前走、逐格截圖做成動畫。
     solo-劫影：只畫那一隻、背景透明。只在開發的時候用，不進遊戲的建置。 -->
<script type="module">
import { createWard } from '../src/art/ward.js';
import { createHall } from '../src/art/hall.js';
import { createTitle } from '../src/art/title.js';
const c = document.getElementById('c'), shot = new URLSearchParams(location.search).get('shot') || 'title';
const zoom = { w: 170, h: 128, cx: 183, cy: 80 }, face = (cx, cy, w = 120) => ({ w: w * 1.33, h: w, cx, cy });
const CREATURES = ['moth', 'frog', 'crab', 'newt', 'bird', 'tortoise', 'heron', 'puffer', 'otter', 'squid', 'mouse', 'eel'];
const ELDERS = ['e-nie', 'e-lu', 'e-guan', 'e-chu', 'e-ge'];
let s, tweak = () => {}, steps = 60;
if (shot === 'title') { s = createTitle(c, {}); steps = 140; }
else if (shot === 'hall') { s = createHall(c, { hero: 'zhi' }); tweak = (st) => { st.talker = 'cen'; }; }
else if (shot === 'ward') { s = createWard(c, { patient: 'lin', hero: 'zhi' }); tweak = (st) => { st.veil = 0.75; st.veilShown = 0.75; }; }
else if (shot === 'exam') { s = createWard(c, { patient: 'lin', hero: 'zhi' }); tweak = (st) => { st.veil = 0.2; st.veilShown = 0.2; st.talker = 'hero'; }; }
else if (shot.startsWith('solo-')) { const look = shot.slice(5); if (!CREATURES.includes(look)) throw new Error(look); document.documentElement.classList.add('clear'); s = createWard(c, { patient: 'lin', shadow: look, solo: true, view: { w: 150, h: 150, cx: 178, cy: 82 } }); }
else if (shot.startsWith('c-')) { const look = shot.slice(2); s = createWard(c, { patient: 'lin', shadow: look, view: zoom }); tweak = (st) => { st.veil = 0; st.veilShown = 0; }; if (!CREATURES.includes(look)) throw new Error(look); }
else if (shot.startsWith('e-')) { if (!ELDERS.includes(shot)) throw new Error(shot); s = createWard(c, { patient: shot, view: face(92, 170) }); tweak = (st) => { st.hide = true; }; }
else if (shot === 'tower-dark' || shot === 'tower-lit') { s = createWard(c, { patient: 'dong', scene: 'tower' }); tweak = (st) => { st.hide = true; st.beam = shot === 'tower-lit' ? 1 : 0; }; }
else { s = createWard(c, { patient: { market: 'r-xi', archive: 'r-luan', yard: 'r-duo', quiet: 'r-lu', dock: 'zhou' }[shot], scene: shot }); tweak = (st) => { st.hide = true; }; }
s.state.glow = 0; tweak(s.state);
s.resize(c.clientWidth, c.clientHeight);
let clock = 0;
for (let i = 0; i < steps; i++) { clock += 1 / 20; s.update(clock, 1 / 20); }
s.render();
// 動畫：每呼叫一次往前走 dt 秒再畫一次；set 改場景的狀態（例如霧慢慢散開）
window.adv = (dt) => { clock += dt; s.update(clock, dt); s.render(); };
window.set = (k, v) => { s.state[k] = v; };
document.body.dataset.ready = '1';
</script></body></html>
