<title>黃金一小時 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: one screen. The 3D bedside fills it edge to edge; a monitor strip sits on top, the team tray on the bottom,
   and the bundle panel moves to the left rail at ≥ 900px. Single look on purpose: a night-shift ICU. */
:root {
  --bg: #0c1920;
  --panel: rgba(10, 21, 27, 0.82);
  --panel-2: #14262f;
  --ink: #e6eef2;
  --ink-2: #9db0bb;
  --line: #29454f;
  --accent: #36c2b9;
  --accent-ink: #04201e;
  --accent-soft: rgba(54, 194, 185, 0.16);
  --good: #5fcf85;
  --warn: #f0a64a;
  --crit: #ff7a6e;
  --lac: #a990ff;
  --germ: #9be04a;
  --r-assessor: #7aa7ea;
  --r-interventionist: #f08a4b;
  --r-coordinator: #6fcf86;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --fs-xs: 0.6875rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.25rem;
  --radius: 7px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.5;
  overflow: hidden;
}
h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#labels, #vignette { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#vignette { background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(3, 9, 12, 0.6) 100%); }
#vignette.harm { animation: harm 0.55s ease-out; }
@keyframes harm { 0% { box-shadow: inset 0 0 90px 30px rgba(255, 70, 60, 0.55); } 100% { box-shadow: inset 0 0 90px 30px rgba(255, 70, 60, 0); } }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

/* ── Top: round, patient safety, clock */
#north {
  position: absolute; top: 8px; left: var(--gutter-l); right: var(--gutter-r);
  display: flex; flex-direction: column; gap: 6px; pointer-events: none;
}
#north > * { pointer-events: auto; }
#top {
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-areas: "round safety" "clock clock";
  gap: 6px 12px; padding: 8px 10px; border-bottom: 2px solid var(--accent); align-items: center;
}
.round { grid-area: round; display: flex; align-items: center; gap: 6px; min-width: 0; }
.round-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.round-t strong { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-md); letter-spacing: 0.02em; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.eyebrow { font-size: var(--fs-xs); color: var(--accent); font-weight: 600; letter-spacing: 0.04em; }
.ib {
  font: inherit; font-size: var(--fs-lg); line-height: 1; color: var(--ink); cursor: pointer; flex: none;
  width: 34px; height: 40px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-2);
}
.ib:disabled { opacity: 0.35; cursor: default; }
.safety { grid-area: safety; display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: center; min-width: 0; }
.safety .k { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--ink-2); }
.safety b { font-size: var(--fs-lg); font-weight: 600; line-height: 1.1; }
.meter { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; background: var(--good); transition: width 0.35s ease; }
.meter.warn i { background: var(--warn); }
.meter.crit i { background: var(--crit); }
.clock { grid-area: clock; display: grid; grid-template-columns: 5.2em 1fr; gap: 10px; align-items: center; }
.clock b { font-size: var(--fs-lg); font-weight: 600; color: var(--accent); line-height: 1; }
.tl { position: relative; height: 8px; border-radius: 4px; background: var(--panel-2); margin: 14px 0 13px; }
.tl-win { position: absolute; inset: 0 auto 0 0; border-radius: 4px 0 0 4px; border-right: 2px solid var(--ink-2); background: rgba(157, 176, 187, 0.14); }
.tl.shock .tl-win { border-right-color: var(--warn); background: rgba(240, 166, 74, 0.22); }
.tl-fill { position: absolute; inset: 2px auto 2px 0; width: 0; border-radius: 2px; background: var(--accent); }
.tl-60 { position: absolute; top: 10px; transform: translateX(-50%); font-size: var(--fs-xs); color: var(--ink-2); }
.tl.shock .tl-60 { color: var(--warn); }
.tl-mark { position: absolute; top: -17px; transform: translateX(-50%); font-size: var(--fs-xs); font-weight: 600; padding: 0 5px; border-radius: 3px; white-space: nowrap; background: var(--good); color: var(--accent-ink); }
.tl-mark.late { background: var(--crit); }

/* ── Bundle + role traits */
#traits { padding: 7px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "head roles" "chips chips"; gap: 6px 10px; align-items: center; }
.h1 { display: contents; }
.h1-h { grid-area: head; }
.chips { grid-area: chips; }
.roles { grid-area: roles; }
.h1-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: var(--fs-sm); white-space: nowrap; }
.h1-h .num { font-size: var(--fs-lg); font-weight: 600; line-height: 1; }
.h1-h small { font-size: var(--fs-xs); color: var(--ink-2); }
.h1.t2 .h1-h { color: var(--accent); }
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.chip {
  display: flex; flex-direction: column; align-items: center; gap: 0; padding: 3px 2px; min-width: 0;
  border: 1px dashed var(--line); border-radius: 5px; font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.25;
}
.chip .dot { display: none; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--line); }
.chip .nm { font-weight: 700; white-space: nowrap; }
.chip .when { min-height: 1.25em; }
.chip.on { border-style: solid; border-color: var(--accent); color: var(--ink); }
.chip.on .dot { border-color: var(--accent); }
.chip.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: lit 0.45s ease-out; }
.chip.done .dot { background: var(--accent-ink); border-color: var(--accent-ink); }
.chip.done.still { animation: none; }
@keyframes lit { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
.eff { font-size: var(--fs-xs); color: var(--ink-2); }
.h1 > .eff { display: none; }
.roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.role { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: var(--fs-xs); padding: 2px 3px; white-space: nowrap; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); min-width: 0; }
.role .rn { font-weight: 700; }
.role .eff { display: none; }
.role.r-assessor { border-left: 3px solid var(--r-assessor); }
.role.r-interventionist { border-left: 3px solid var(--r-interventionist); }
.role.r-coordinator { border-left: 3px solid var(--r-coordinator); }
.role.on { color: var(--ink); background: var(--panel-2); }

/* ── Bottom tray */
#south {
  position: absolute; bottom: 8px; left: var(--gutter-l); right: var(--gutter-r);
  padding: 9px 10px; display: flex; flex-direction: column; gap: 8px; max-height: 52%; overflow-y: auto;
}
.info { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; font-size: var(--fs-sm); color: var(--ink-2); min-height: 3em; }
.info p { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.info b { color: var(--ink); }
.info.sel p { color: var(--ink); }
.info-a { display: flex; gap: 6px; flex: none; }
.bench { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.card {
  font: inherit; color: var(--ink); text-align: left; cursor: pointer; flex: 0 0 84px; min-width: 0;
  display: flex; flex-direction: column; gap: 1px; padding: 6px 6px 6px 10px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--panel-2); box-shadow: inset 4px 0 0 var(--ink-2); line-height: 1.3;
}
.card.r-assessor { box-shadow: inset 4px 0 0 var(--r-assessor); }
.card.r-interventionist { box-shadow: inset 4px 0 0 var(--r-interventionist); }
.card.r-coordinator { box-shadow: inset 4px 0 0 var(--r-coordinator); }
.card.r-dual { box-shadow: inset 2px 0 0 var(--r-assessor), inset 4px 0 0 var(--r-coordinator); }
.c-n { font-weight: 700; font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-b { font-size: var(--fs-xs); color: var(--accent); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-s { font-size: var(--fs-xs); color: var(--ink-2); }
.card.placed { background: transparent; }
.card.placed .c-s { color: var(--ink); }
.card.sel { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--accent-soft); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.count { font-size: var(--fs-sm); color: var(--ink-2); margin-right: auto; }
.btn {
  font: inherit; font-size: var(--fs-sm); font-weight: 700; color: var(--ink); cursor: pointer;
  min-height: 40px; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-2);
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding-inline: 16px; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 34px; padding: 3px 10px; font-size: var(--fs-xs); }
.ticker { font-size: var(--fs-sm); min-height: 2.9em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#south:has(.ticker) .actions { justify-content: flex-end; }

.result { display: flex; flex-direction: column; gap: 8px; }
.res-h h2 { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-lg); letter-spacing: 0.03em; }
.result.win h2 { color: var(--accent); }
.result.lose h2 { color: var(--crit); }
.res-h p { font-size: var(--fs-xs); color: var(--ink-2); }
.exec { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.exec li { display: flex; flex-direction: column; align-items: center; padding: 4px 2px; border-radius: 5px; border: 1px dashed var(--line); font-size: var(--fs-xs); color: var(--ink-2); }
.exec li b { font-size: var(--fs-md); font-weight: 600; }
.exec li.yes { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.notes { display: flex; flex-direction: column; gap: 4px; }
.note { display: flex; flex-direction: column; gap: 1px; font-size: var(--fs-sm); padding: 5px 8px; border-radius: 5px; border-left: 3px solid var(--ink-2); background: var(--panel-2); }
.note small { font-size: var(--fs-xs); color: var(--ink-2); }
.note.warn { border-left-color: var(--warn); }
.note.good { border-left-color: var(--good); }
.note.info { border-left-color: var(--accent); }
.more summary { cursor: pointer; font-size: var(--fs-sm); color: var(--ink-2); padding: 2px 0; }
.more[open] summary { margin-bottom: 4px; }
.result .actions { justify-content: flex-end; }

/* ── Labels projected from the 3D scene */
.tag {
  position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: var(--fs-xs); font-weight: 700; padding: 2px 6px 3px; border-radius: 4px; background: rgba(6, 14, 18, 0.78); color: var(--ink);
}
.tag .bar { width: 46px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
.tag .bar i { display: block; height: 100%; background: var(--crit); transition: width 0.2s linear; }
.tag.k-pathogen .bar i { background: var(--germ); }
.tag.k-lactate .bar i { background: var(--lac); }
.tag.ghost { color: var(--ink-2); }
.tag.ghost .bar i { background: repeating-linear-gradient(45deg, var(--lac) 0 4px, transparent 4px 8px); }
.tag.dead { opacity: 0.55; }
.slot-tag {
  position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; display: flex; align-items: baseline; gap: 3px;
  font-family: var(--font-data); font-size: var(--fs-xs); line-height: 1.2; padding: 1px 5px; border-radius: 4px;
  background: #0b4b46; color: #d9fffb; border: 1px solid var(--accent);
}
.slot-tag b { font-size: var(--fs-sm); font-weight: 600; }
.slot-tag span { opacity: 0.85; }
.slot-tag.late { background: #4a3a10; color: #ffe9b8; border-color: var(--warn); }
.pop {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-family: var(--font-data); font-weight: 600; font-size: 1.125rem; color: #ffffff;
  text-shadow: 0 1px 0 #000, 0 0 8px rgba(0, 0, 0, 0.9); animation: floatUp 0.95s ease-out forwards;
}
.pop.crit { font-size: 1.5rem; color: #ffe066; }
.pop.ok { font-family: var(--font-body); font-weight: 700; font-size: var(--fs-md); color: var(--good); }
.pop.harm { font-family: var(--font-body); font-weight: 700; font-size: var(--fs-md); color: var(--crit); }
@keyframes floatUp { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }
.bubble {
  position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; max-width: 15em; overflow: hidden; text-overflow: ellipsis;
  font-size: var(--fs-xs); font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #f2f7f9; color: #10202a;
}
.bubble.buff { background: var(--accent); color: var(--accent-ink); }
.bubble.warn { background: var(--warn); color: #2a1a00; }

#toast {
  position: absolute; z-index: 5; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); font-size: var(--fs-sm); font-weight: 700; padding: 8px 14px; border-radius: var(--radius);
}
#loading {
  position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: var(--bg); color: var(--ink); text-align: center; padding: 24px; font-size: var(--fs-md);
}
#loading b { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-lg); letter-spacing: 0.04em; }
#loading span { color: var(--ink-2); max-width: 28em; }

/* ── Wide screens: bundle panel becomes a left rail, tray is centred */
@media (min-width: 900px) {
  #top { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.6fr) minmax(0, 0.9fr); grid-template-areas: "round clock safety"; padding: 10px 14px; gap: 18px; }
  .round-t strong { font-size: var(--fs-lg); }
  #north { display: block; }
  #traits { position: absolute; left: 0; top: calc(100% + 8px); width: 248px; padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .h1 { display: flex; flex-direction: column; gap: 6px; }
  .chips { grid-template-columns: 1fr; gap: 3px; }
  .chip { flex-direction: row; justify-content: flex-start; gap: 8px; padding: 4px 8px; font-size: var(--fs-sm); }
  .chip .dot { display: block; }
  .chip .when { margin-left: auto; min-height: 0; }
  .h1 > .eff { display: block; }
  .roles { grid-template-columns: 1fr; }
  .role { display: grid; grid-template-columns: 1fr auto; justify-content: stretch; padding: 4px 8px; font-size: var(--fs-sm); }
  .role .eff { display: block; grid-column: 1 / -1; }
  #south { left: 50%; right: auto; transform: translateX(-50%); width: min(1080px, calc(100% - var(--gutter-l) - var(--gutter-r))); }
  #south.as-result { left: auto; right: var(--gutter-r); transform: none; bottom: auto; top: 86px; width: 340px; max-height: calc(100% - 102px); }
  #south.as-result .exec { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .card { flex: 1 1 0; }
}
@media (prefers-reduced-motion: reduce) {
  .chip.done, #vignette.harm { animation: none; }
  .meter i, .tag .bar i { transition: none; }
}
</style>
<div id="app">
  <canvas id="stage" aria-label="3D 床邊棋盤：我方 8 個位置對上病灶"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="north">
    <header id="top" class="panel"></header>
    <aside id="traits" class="panel" aria-label="羈絆"></aside>
  </div>
  <footer id="south" class="panel"></footer>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="loading"><b>黃金一小時</b><span>正在載入 3D 模型…</span></div>
</div>
<noscript><p style="padding:24px">需要啟用 JavaScript 才能遊玩。</p></noscript>
<script src="rules/data.js" charset="utf-8"></script>
<script src="rules/sim.js" charset="utf-8"></script>
<script src="presets.js" charset="utf-8"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
<script>
// 載入失敗或太久時，換掉「正在載入」的字，不讓畫面卡住沒說明
window.__loadFail = function (msg) {
  var l = document.getElementById('loading');
  if (!l || l.hidden || (window.__stage3d && window.__stage3d.ready)) return;
  var s = l.querySelector('span');
  if (s) s.textContent = msg;
};
setTimeout(function () {
  window.__loadFail('載入超過 20 秒。可能是網路連不到 three.js 的 CDN（cdn.jsdelivr.net），或瀏覽器版本太舊。可以改玩 2D 灰盒版。');
}, 20000);
</script>
<script type="module" src="main.js" onerror="window.__loadFail('3D 程式沒有載入成功。請確認網路連得到 cdn.jsdelivr.net，再重新整理。')"></script>
